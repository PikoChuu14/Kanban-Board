# Local development only. This profile intentionally does not import the
# installed application's ProgramData configuration or production secrets.
server.port=8081
app.base-url=http://localhost:5173

# Reconnect to the existing development database; do not create or reset it.
spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/kanban_db}
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:}

# A separate, non-production signing key for local development. Override it
# with DEV_JWT_SECRET or config/dev-secrets.properties when desired.
app.jwt.secret=${DEV_JWT_SECRET:local-development-only-jwt-secret-change-me-please-2026}
app.jwt.secret.encoding=raw

# Keep local logs out of the installed production data directory.
logging.file.name=logs/kovax-flowops-dev.log
app.bootstrap.secrets-file=config/dev-secrets.properties
